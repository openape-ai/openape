# Shared with the local pre-push gate: scripts/check.mjs + .openape/checks.json.
# Manual dispatch only: the owner keeps CI paused (issue 1448, confirmed for the
# GitHub move on November 16, 2026); the local pre-push gate is the PR check.
# A dispatch on main runs the complete unit contract, on a branch the affected
# subset. Deploys stay local (pnpm run deploy:image); there is no deploy workflow.
name: CI
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable
      - name: Locate dependency caches
        id: dependency-cache
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.dependency-cache.outputs.store }}
            ~/.cache/electron
          key: dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: dependencies-${{ runner.os }}-${{ runner.arch }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Restore check cache
        uses: actions/cache@v4
        with:
          path: .turbo-cache
          key: checks-${{ runner.os }}-unit-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ env.HEAD_SHA }}
          restore-keys: checks-${{ runner.os }}-unit-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-
      - name: Shared unit contract
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            pnpm check:ci --suite unit
          else
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            pnpm check:affected --base origin/main --head "$HEAD_SHA" --suite unit
          fi
        env:
          TURBO_CACHE_DIR: .turbo-cache
      - name: Preserve complete check logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-check-results
          path: .openape/check-results/
          if-no-files-found: warn
