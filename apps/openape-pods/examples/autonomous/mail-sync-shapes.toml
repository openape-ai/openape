schema = "openape-shapes/v1"
[cli]
id = "o365-cli"
executable = "o365-cli"
audience = "shapes"
version = "autonomous-mail-sync-2"
[[operation]]
id = "workflow.delta"
command = ["workflow", "delta"]
required_options = ["account", "folder"]
display = "Read {folder} changes of {account}"
action = "read"
risk = "low"
resource_chain = ["account:email={account}", "mail:*"]
[[operation]]
id = "workflow.read"
command = ["workflow", "read"]
required_options = ["account", "message"]
display = "Read one provider-versioned message for {account}"
action = "read"
risk = "low"
resource_chain = ["account:email={account}", "mail:*"]
[[operation]]
id = "workflow.categorize"
command = ["workflow", "categorize"]
required_options = ["account", "message", "expected-version", "categories"]
display = "Set the Pod-managed categories of one message of {account}"
action = "categorize"
risk = "medium"
resource_chain = ["account:email={account}", "mail:*"]
[[operation]]
id = "workflow.ensure-categories"
command = ["workflow", "ensure-categories"]
required_options = ["account", "categories"]
display = "Add missing names to the Outlook category list of {account}"
action = "configure"
risk = "medium"
resource_chain = ["account:email={account}", "mailbox-settings:*"]
[[operation]]
id = "auth.login"
command = ["auth", "login"]
required_options = ["account"]
display = "Sign in {account} in the Pod terminal"
action = "login"
risk = "medium"
resource_chain = ["account:email={account}"]
