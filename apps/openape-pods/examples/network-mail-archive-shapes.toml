schema = "openape-shapes/v1"
[cli]
id = "o365-cli"
executable = "o365-cli"
audience = "shapes"
version = "network-archive-1"
# Example only. Production uses the protected o365 registry adapter.
[[operation]]
id = "workflow.review-archive"
command = ["workflow", "review-archive"]
required_options = ["account", "message", "operation"]
display = "Review {message} of {account}"
action = "read"
risk = "low"
exact_command = true
resource_chain = ["account:email={account}", "mail:id={message}"]
[[operation]]
id = "workflow.archive"
command = ["workflow", "archive"]
required_options = ["account", "message", "content-version", "sender", "subject", "source-folder", "destination", "operation", "journal"]
display = "Archive {subject} from {sender} in {account}"
action = "move"
decision = "once"
risk = "high"
exact_command = true
resource_chain = ["account:email={account}", "mail:id={message}"]
