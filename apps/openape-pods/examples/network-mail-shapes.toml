schema = "openape-shapes/v1"
[cli]
id = "o365-cli"
executable = "o365-cli"
audience = "shapes"
version = "network-preview-1"
[[operation]]
id = "mail.list"
command = ["mail", "list"]
required_options = ["account", "folder", "limit"]
display = "List the bounded mail sample for {account}"
action = "list"
risk = "low"
resource_chain = ["account:email={account}", "mail:*"]
[[operation]]
id = "workflow.read"
command = ["workflow", "read"]
required_options = ["account", "message"]
display = "Read one provider-versioned message for {account}"
action = "read"
risk = "low"
resource_chain = ["account:email={account}", "mail:*"]
