id = "git.rev-parse"
command = ["rev-parse"]
positionals = ["ref"]
value_options = []
flag_options = ["abbrev-ref", "symbolic-full-name", "verify", "short", "quiet", "q"]
display = "Resolve {ref}"
action = "read"
risk = "low"
resource_chain = ["repo:*"]

[[operation]]
id = "git.rebase.upstream"
command = ["rebase"]
positionals = ["upstream"]
value_options = ["onto"]
flag_options = ["autostash", "no-autostash", "update-refs", "quiet", "q"]
display = "Rebase the current branch onto {upstream}"
action = "rebase"
risk = "high"
exact_command = true
resource_chain = ["repo:*"]

[operation.presentation]
title = { de = "Aktuellen Branch auf {upstream} rebasen", en = "Rebase the current branch onto {upstream}" }

[operation.presentation.consequence]
allows = { de = "Schreibt die Commits des aktuellen Branches lokal auf {upstream} neu; lokale Branches und das Arbeitsverzeichnis ändern sich.", en = "Rewrites the commits of the current branch locally onto {upstream}; local branches and the working tree change." }
does_not_allow = { de = "Schreibt nichts auf den Server. Gilt nur für genau diesen Befehl mit diesen Optionen; jeder andere Befehl braucht eine eigene Freigabe.", en = "Writes nothing to the server. Covers only this exact command with these options; any other command needs its own approval." }

[[operation.presentation.facts]]
label = { de = "Repository", en = "Repository" }
binding = "repo"
format = "code"

[[operation.presentation.facts]]
label = { de = "Neue Basis", en = "New base" }
binding = "onto"
format = "code"

[[operation]]
id = "git.push.refspec"
command = ["push"]
positionals = ["remote", "refspec"]
value_options = []
flag_options = ["force-with-lease", "force", "f", "set-upstream", "u", "atomic", "quiet", "q"]
display = "Push {refspec} to {remote}"
action = "push"
risk = "high"
exact_command = true
resource_chain = ["repo:*", "remote:name={remote}"]

[operation.presentation]
title = { de = "{refspec} nach {remote} pushen", en = "Push {refspec} to {remote}" }

[operation.presentation.consequence]
allows = { de = "Schreibt auf den Server: {remote} wird gemäß {refspec} aktualisiert, mit den angegebenen Optionen.", en = "Writes to the server: {remote} is updated as given by {refspec}, with the options shown." }
does_not_allow = { de = "Gilt nur für genau diesen Befehl mit diesen Optionen; jeder andere Befehl braucht eine eigene Freigabe.", en = "Covers only this exact command with these options; any other command needs its own approval." }

[[operation.presentation.facts]]
label = { de = "Repository", en = "Repository" }
binding = "repo"
format = "code"

[[operation.presentation.facts]]
label = { de = "Refspec", en = "Refspec" }
binding = "refspec"
format = "code"

