schema = "openape-shapes/v1"
[cli]
id = "o365-cli"
executable = "o365-cli"
audience = "shapes"
version = "pods-1"
[[operation]]
id = "pods.read"
command = ["pods", "read"]
required_options = ["account", "folder", "operation"]
display = "Read {operation} in {folder} for {account}"
action = "read"
risk = "low"
resource_chain = ["mail-account:email={account}", "mail-folder:id={folder}", "mail-operation:name={operation}"]

[[operation]]
id = "pods.login"
command = ["pods", "login"]
required_options = ["account"]
display = "Set up o365-cli for {account}"
action = "login"
risk = "medium"
resource_chain = ["mail-account:email={account}"]
