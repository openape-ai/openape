schema = "openape-shapes/v1"

# OpenApe Pods runtime authority (issue 1473). `pod-runtime` is no installed
# program: the Pods desktop builds this argv itself and requests one grant per
# Pod to run its stored script. This registry file is the single source; the
# OpenApe monorepo ships a byte-identical copy in
# apps/openape-pods/runtime-sources/pod-runtime-shapes.toml, and grants bind
# its digest. The presentation reproduces the former IdP Pod run card; the IdP
# uses it only for requests whose target is this Pod (`requires`).

[cli]
id = "pod-runtime"
executable = "pod-runtime"
audience = "shapes"
version = "1"

[[operation]]
id = "run"
command = ["run"]
required_options = ["pod", "name", "script", "workspace"]
display = "Run the stored script of {name}"
action = "run"
risk = "high"
resource_chain = ["pod:id={pod}"]

[operation.presentation]
title = { de = "{name}", en = "{name}" }
statement = { de = "Gespeichertes Pod-Skript ausführen", en = "Run the stored Pod script" }
details_note = { de = "Die angezeigten Pfade und Werte sind Angaben der anfragenden Anwendung. Geheimniswerte werden nicht angefordert.", en = "Paths and values are supplied by the requesting application. Secret values are not requested." }
requires = { target_host = "pods:{pod}" }

[operation.presentation.consequence]
allows = { de = "Erlaubt diesem Pod, seine gespeicherten Skripte innerhalb der separat vergebenen Zugriffsrechte auszuführen. Skriptänderungen benötigen keine erneute Ausführungserlaubnis.", en = "Allows this Pod to execute its stored scripts within its separately assigned permissions. Script changes do not require a new execution permission." }
does_not_allow = { de = "Eine dauerhafte Freigabe gilt bis zum Widerruf. Sie aktiviert keinen Zeitplan und erlaubt keine beliebigen Shell-Befehle.", en = "Continuing permission lasts until revoked. It does not enable a schedule or authorize arbitrary shell commands." }

[[operation.presentation.facts]]
label = { de = "Skript", en = "Script" }
binding = "script"
format = "code"

[[operation.presentation.facts]]
label = { de = "Arbeitsverzeichnis", en = "Working directory" }
binding = "workspace"
format = "code"

[[operation.presentation.details]]
label = { de = "Umgebungsvariablen", en = "Environment variables" }
binding = "environment"
format = "map"
