schema = "openape-shapes/v1"

# OpenApe Pods SSH inventory authority (issue 1473). `pod-ssh` is no installed
# program: the Pods desktop builds this argv for a reviewed SSH binding and
# reads a fixed inventory profile. This registry file is the single source;
# the OpenApe monorepo ships a byte-identical copy in
# apps/openape-pods/runtime-sources/pod-ssh-shapes.toml, and grants bind its
# digest.

[cli]
id = "pod-ssh"
executable = "pod-ssh"
audience = "shapes"
version = "1"

[[operation]]
id = "inventory"
command = ["inventory"]
required_options = ["binding", "profile"]
display = "Read fixed SSH inventory {profile} for reviewed binding {binding}"
action = "read"
risk = "low"
resource_chain = ["ssh-binding:hash={binding}", "inventory-profile:name={profile}"]
