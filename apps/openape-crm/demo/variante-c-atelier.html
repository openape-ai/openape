<html lang="de">

<meta charset="utf-8">

<title>Variante C · Atelier — OpenApe CRM Demo</title>
<style>
:root{
  --paper:#faf7f2; --card:#fffdfa; --line:#e6ded1; --line-2:#d8ccb8;
  --ink:#2a2520; --ink-2:#6b6055; --ink-3:#9a8d7e;
  --accent:#b4451f; --accent-soft:#fbeee6;
  --forest:#2f6b4a; --forest-soft:#e6f2ea; --gold:#96700f; --gold-soft:#faf0d8;
  --plum:#6d3a7a; --plum-soft:#f4eaf6; --r:14px;
  --shadow:0 1px 2px rgba(80,60,40,.05),0 4px 14px rgba(80,60,40,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.serif{font-family:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:600;letter-spacing:-.2px}

/* header */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar{max-width:1720px;margin:0 auto;padding:14px 26px 0;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:ui-serif,Georgia,serif;font-size:17px;font-weight:600}
.brand i{width:30px;height:30px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px}
.search{margin-left:auto;position:relative;width:300px}
.search input{width:100%;border:1px solid var(--line);border-radius:22px;padding:8px 14px 8px 34px;background:var(--paper)}
.search input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.search::before{content:"⌕";position:absolute;left:13px;top:6px;color:var(--ink-3);font-size:16px}
.results{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:40}
.results div{padding:9px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.results div:hover{background:var(--accent-soft)}
.results .t{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);width:54px;flex:none}
.results .s{margin-left:auto;color:var(--ink-3);font-size:12px}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.tabs{max-width:1720px;margin:0 auto;padding:0 26px;display:flex;gap:26px}
.tabs button{border:0;background:none;padding:12px 0;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;position:relative}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs button b{font-weight:500;color:var(--ink-3);margin-left:5px;font-size:12px}

main{max-width:1720px;margin:0 auto;padding:24px 26px 60px}
.title{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
.title h1{margin:0;font-size:26px}
.title p{margin:0;color:var(--ink-2)}
.right{margin-left:auto;display:flex;gap:9px}
.btn{border:1px solid var(--line-2);background:var(--card);padding:8px 15px;border-radius:22px;cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#9c3a19}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.gh{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.gh:hover{background:var(--accent-soft);color:var(--accent)}

/* board */
.board{display:flex;gap:16px;overflow-x:auto;padding-bottom:14px}
.col{flex:0 0 264px}
.col > h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.col > h3 em{font-style:normal;margin-left:auto;background:var(--line);color:var(--ink-2);border-radius:20px;padding:1px 9px;font-size:12px;font-family:ui-sans-serif,sans-serif}
.col.end > h3{color:var(--ink-3)}
.drop{min-height:120px;border-radius:var(--r);padding:2px;transition:background .12s}
.drop.over{background:var(--accent-soft);outline:2px dashed var(--line-2)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--line-2);transform:translateY(-1px)}
.tile h4{margin:0 0 3px;font-size:15px;font-family:ui-serif,Georgia,serif;font-weight:600}
.tile .who{display:flex;align-items:center;gap:7px;color:var(--ink-2);margin:9px 0 0}
.faces{display:flex}
.face{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#fff;border:2px solid var(--card);margin-left:-7px}
.face:first-child{margin-left:0}
.tile .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.chip{font-size:12px;padding:2px 10px;border-radius:20px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);border-color:#f0d9cb;color:var(--accent)}
.chip.forest{background:var(--forest-soft);border-color:#cfe4d7;color:var(--forest)}
.chip.gold{background:var(--gold-soft);border-color:#eddfb6;color:var(--gold)}
.chip.plum{background:var(--plum-soft);border-color:#e6d3ec;color:var(--plum)}
.muted{color:var(--ink-3)}
.hint{color:var(--ink-3);font-size:12.5px;font-style:italic}

/* generic cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel h3{margin:0;padding:14px 18px;font-size:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.panel .in{padding:14px 18px}
.rowline{display:flex;gap:10px;align-items:flex-start;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.rowline:last-child{border-bottom:0}
.rowline:hover{background:var(--paper)}

/* slide-over */
.scrim{position:fixed;inset:0;background:rgba(50,38,28,.34);z-index:50;display:flex;justify-content:flex-end}
.sheet{width:min(700px,97vw);background:var(--paper);height:100%;overflow:auto;box-shadow:-24px 0 60px rgba(60,45,30,.22);
  border-left:1px solid var(--line-2)}
.sheet .sh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:18px 24px;z-index:5}
.sheet .sh h2{margin:0;font-size:22px}
.sheet .bd{padding:20px 24px 60px;display:flex;flex-direction:column;gap:18px}
.x{border:0;background:none;font-size:22px;color:var(--ink-3);cursor:pointer;line-height:1}
.x:hover{color:var(--ink)}
.path{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.node{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.node:hover{border-color:var(--accent);color:var(--accent)}
.node.on{background:var(--accent);border-color:var(--accent);color:#fff}
.node.end{border-style:dashed}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:14px;padding:14px 0}
.tl li+li{border-top:1px solid var(--line)}
.bul{width:32px;height:32px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:14px;background:var(--paper);border:1px solid var(--line)}
.bul.mail{background:var(--accent-soft);border-color:#f0d9cb;color:var(--accent)}
.bul.notiz{background:var(--gold-soft);border-color:#eddfb6;color:var(--gold)}
.bul.aufgabe{background:var(--plum-soft);border-color:#e6d3ec;color:var(--plum)}
.bul.termin{background:var(--forest-soft);border-color:#cfe4d7;color:var(--forest)}
.tl b{font-weight:600}
.tl .ts{margin-left:auto;color:var(--ink-3);font-size:12px;white-space:nowrap}
.tl p{margin:3px 0 0;color:var(--ink-2)}
.write{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);background:var(--paper)}
.write input{flex:1;border:1px solid var(--line);border-radius:22px;padding:8px 14px;background:var(--card)}
.write input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.kv{display:grid;grid-template-columns:104px 1fr;gap:7px 12px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.ctr{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--card)}
.ctr .h{padding:12px 16px;display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ctr table{width:100%;border-collapse:collapse;font-size:13px}
.ctr td,.ctr th{padding:8px 16px;text-align:left;border-bottom:1px solid var(--line)}
.ctr th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.ctr tr:last-child td{border-bottom:0}
.ctr .foot{padding:11px 16px;display:flex;gap:10px;align-items:center;background:var(--paper);border-top:1px solid var(--line)}

/* wizard */
.mid{position:fixed;inset:0;background:rgba(50,38,28,.4);z-index:60;display:grid;place-items:center;padding:20px}
.wz{background:var(--paper);width:min(700px,96vw);max-height:88vh;overflow:auto;border-radius:20px;box-shadow:0 30px 80px rgba(50,38,28,.35)}
.wz .h{padding:20px 26px 0;display:flex;align-items:flex-start;gap:12px}
.wz .h h2{margin:0;font-size:21px}
.wz .steps{display:flex;gap:0;padding:16px 26px 0}
.wz .steps div{flex:1;text-align:center;font-size:11.5px;color:var(--ink-3);position:relative;padding-bottom:12px}
.wz .steps div::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.wz .steps div.on{color:var(--accent);font-weight:600}
.wz .steps div.on::after,.wz .steps div.done::after{background:var(--accent)}
.wz .bd{padding:20px 26px}
.wz .ft{padding:16px 26px 20px;display:flex;gap:10px;border-top:1px solid var(--line);background:var(--card);border-radius:0 0 20px 20px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:5px}
.f{margin-bottom:14px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.row{display:flex;gap:12px}.row>*{flex:1}
.pos{display:grid;grid-template-columns:1fr 92px 84px 118px 30px;gap:8px;margin-bottom:8px;align-items:center}
.pos input,.pos select{width:100%;border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:var(--card)}
.paper{border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;z-index:90;box-shadow:0 10px 30px rgba(50,38,28,.3)}
</style>
</head>

  fertig: 'fertig abgeschlossen',
  gekuendigt: 'gekündigt',
};

/* ---------- Fachlogik ---------- */

const CRM = {
  pipelines: PIPELINES, waehrungen: WAEHRUNGEN, abrechnung: ABRECHNUNG, users: USERS,
  produkte: PRODUKTE, firmen: FIRMEN, personen: PERSONEN, vorgaenge: VORGAENGE,
  aufgaben: AUFGABEN, threads: THREADS, threadStatus: THREAD_STATUS, vertragStatus: VERTRAG_STATUS,

  firma: (v) => FIRMEN.find((f) => f.id === v.firmaId),
  personenVon: (v) => v.personIds.map((id) => PERSONEN.find((p) => p.id === id)),
  produkt: (id) => PRODUKTE.find((p) => p.id === id),
  user: (id) => USERS.find((u) => u.id === id),
  vorgang: (id) => VORGAENGE.find((v) => v.id === id),
  stufe: (phase, id) => PIPELINES[phase].stufen.find((s) => s.id === id),
  name: (p) => [p.titel, p.vorname, p.nachname].filter(Boolean).join(' '),
  initialen: (p) => ((p.vorname || '')[0] || '') + ((p.nachname || '')[0] || ''),

  geld(betrag, waehrung = 'EUR') {
    return new Intl.NumberFormat('de-AT', { style: 'currency', currency: waehrung, maximumFractionDigits: 0 }).format(betrag);
  },

  datum(iso) {
    if (!iso) return '—';
    const [d] = iso.split(' ');
    const [y, m, day] = d.split('-');
    return `${day}.${m}.${y}`;
  },

  /* Vertragsende = Startdatum + Mindestlaufzeit, nur wenn Mindestlaufzeit gesetzt (Spec 3.4) */
  vertragsende(vertrag) {
    if (!vertrag.mindestlaufzeit) return null;
    const d = new Date(vertrag.startdatum);
    d.setMonth(d.getMonth() + vertrag.mindestlaufzeit);
    return d.toISOString().slice(0, 10);
  },

  positionsSumme: (pos) => pos.preis - (pos.rabatt || 0),

  /* Laufend/einmalig wird abgeleitet, nicht gespeichert (Spec 3.5 / A3) */
  vertragsArt(vertrag) {
    const arten = new Set(vertrag.positionen.map((p) => (p.abrechnung === 'einmalig' ? 'einmalig' : 'laufend')));
    return arten.size > 1 ? 'gemischt' : [...arten][0];
  },

  vertragsWert(vertrag) {
    return vertrag.positionen.reduce((s, p) => s + CRM.positionsSumme(p), 0);
  },

  /* Endmarker-Stufen ueberfuehren den Vorgang automatisch in die naechste Phase (Spec 4) */
  setzeStufe(vorgang, stufeId) {
    const stufe = CRM.stufe(vorgang.phase, stufeId);
    if (stufe.endmarker) {
      const zielPhase = stufe.endmarker;
      vorgang.phase = zielPhase;
      vorgang.stufe = PIPELINES[zielPhase].stufen[0].id;
      CRM.log(vorgang, 'notiz', `Automatisch in Phase „${PIPELINES[zielPhase].label}“ überführt`,
        `Endmarker „${stufe.label}“ erreicht → Landestufe „${PIPELINES[zielPhase].stufen[0].label}“.`);
      return { konvertiert: true, phase: zielPhase };
    }
    vorgang.stufe = stufeId;
    return { konvertiert: false };
  },

  log(vorgang, typ, titel, text) {
    const now = new Date('2026-08-27T09:30:00');
    const ts = `${now.toISOString().slice(0, 10)} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    vorgang.historie.unshift({ typ, ts, autor: 'PH', titel, text });
  },

  /* Angebot signiert → Vertrag aktiv + PDF + Support-Thread (Spec 6.4, Schritte 8/9) */
  angebotAnlegen(vorgang, positionen, waehrung, startdatum, mindestlaufzeit) {
    const vertrag = {
      id: 'c' + (VORGAENGE.reduce((n, v) => n + v.vertraege.length, 0) + 1),
      status: 'offen', startdatum, mindestlaufzeit, waehrung, signiertesPdf: null, positionen,
    };
    vorgang.vertraege.push(vertrag);
    CRM.log(vorgang, 'mail', 'Angebot versendet', `Signaturlink an ${CRM.personenVon(vorgang)[0].emails[0]}, Vertrag im Status „offen“ angelegt.`);
    return vertrag;
  },

  angebotSignieren(vorgang, vertrag) {
    vertrag.status = 'aktiv';
    vertrag.signiertesPdf = `Vertrag-${CRM.firma(vorgang).name.split(' ')[0]}-signiert.pdf`;
    CRM.log(vorgang, 'dokument', `${vertrag.signiertesPdf} abgelegt`, 'Einfache elektronische Signatur (EES) durch den Kunden. Vertrag „offen“ → „aktiv laufend“.');
    THREADS.unshift({
      id: 's' + (THREADS.length + 1), betreff: `Signiertes Angebot – ${CRM.firma(vorgang).name}`,
      status: 'neu', vorgangId: vorgang.id, quelle: 'automatisch',
      nachrichten: [{ von: 'system@openape.ai', ts: '2026-08-27 09:30', text: `Das Angebot wurde signiert. Das PDF liegt am Vertrag ${vertrag.id}.` }],
    });
  },

  suche(q) {
    const s = q.trim().toLowerCase();
    if (!s) return [];
    const treffer = [];
    VORGAENGE.forEach((v) => {
      const hay = [v.titel, CRM.firma(v).name, ...CRM.personenVon(v).flatMap((p) => [CRM.name(p), ...p.emails]),
        ...v.historie.map((h) => h.titel + ' ' + h.text)].join(' ').toLowerCase();
      if (hay.includes(s)) treffer.push({ typ: 'Vorgang', id: v.id, label: v.titel, sub: `${PIPELINES[v.phase].label} · ${CRM.stufe(v.phase, v.stufe).label}` });
    });
    PERSONEN.forEach((p) => {
      if ((CRM.name(p) + ' ' + p.emails.join(' ')).toLowerCase().includes(s)) {
        treffer.push({ typ: 'Person', id: p.id, label: CRM.name(p), sub: p.emails[0] });
      }
    });
    FIRMEN.forEach((f) => {
      if (f.name.toLowerCase().includes(s)) treffer.push({ typ: 'Firma', id: f.id, label: f.name, sub: `${f.plz} ${f.ort}` });
    });
    return treffer.slice(0, 12);
  },
};

window.CRM = CRM;

<script>

  $('#tabs').innerHTML=TABS.map(t=>`<button data-t="${t.id}" class="${cur()===t.id?'on':''}">${t.label}
    ${cnt(t.id)!==''?`<b>${cnt(t.id)}</b>`:''}</button>`).join('');
  $('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;
    const id=b.dataset.t;
    if(CRM.pipelines[id]){view.page='pipeline';view.phase=id;}else view.page=id;
    render();};
}
const cur=()=>view.page==='pipeline'||view.page==='lead-deal-kunde'?view.phase:view.page;

    const inS=items.filter(v=>v.stufe===s.id);
    return `<div class="col ${s.endstufe||s.endmarker?'end':''}">
      <h3>${esc(s.label)}${s.endmarker?' <span class="chip plum">automatisch ↦</span>':''}<em>${inS.length}</em></h3>
      <div class="drop" data-stufe="${s.id}">${inS.map(tile).join('')||'<p class="hint" style="padding:6px 4px">leer</p>'}</div></div>`;}).join('')}</div>`;
}
function tile(v){
  const ps=CRM.personenVon(v);
  const wert=v.vertraege.reduce((a,c)=>a+CRM.vertragsWert(c),0);
  const naechste=CRM.aufgaben.find(a=>a.vorgangId===v.id&&a.status==='offen');
  return `<div class="tile" draggable="true" data-v="${v.id}">
    <h4>${esc(CRM.firma(v).name)}</h4>
    <div class="muted" style="font-size:13px">${esc(v.titel)}</div>
    <div class="who"><div class="faces">${ps.map((p,i)=>`<div class="face" style="background:${FACE[i%FACE.length]}" title="${esc(CRM.name(p))}">${esc(CRM.initialen(p))}</div>`).join('')}</div>
      <span>${ps.map(p=>esc(p.vorname)).join(', ')}</span></div>
    <div class="meta">
      ${v.vertraege.length?`<span class="chip forest">${CRM.geld(wert)} · ${v.vertraege.length} Vertrag${v.vertraege.length>1?'e':''}</span>`:'<span class="chip">kein Vertrag</span>'}

    </div></div>`;
}

function bindSheet(){
  const v=CRM.vorgang(view.sheet);

  $('#ov').querySelectorAll('[data-stufe]').forEach(b=>b.onclick=()=>{
    const r=CRM.setzeStufe(v,b.dataset.stufe);
    if(r.konvertiert){view.phase=r.phase;toast('Endmarker → Vorgang automatisch in Phase „'+CRM.pipelines[r.phase].label+'“');}
    renderSheet();render(true);});
  $('#ov').querySelectorAll('[data-task]').forEach(cb=>cb.onchange=()=>{
    const a=CRM.aufgaben.find(x=>x.id===cb.dataset.task);a.status=cb.checked?'erledigt':'offen';renderSheet();});
  $('#ov').querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>{
    CRM.angebotSignieren(v,v.vertraege.find(c=>c.id===b.dataset.sign));renderSheet();render(true);
    toast('Signiert · Vertrag „aktiv laufend“ · Thread in support@');});
  $('#ov').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='angebot')return startWizard(v);
    if(a==='note'){const t=$('#note').value.trim();if(!t)return;CRM.log(v,'notiz','Notiz',t);renderSheet();return;}
    if(a==='mail'){CRM.log(v,'mail','Mail über CRM gesendet','Absender wählbar: persönliches Postfach oder support@.');renderSheet();return;}
    if(a==='termin'){CRM.log(v,'termin','Kalendereinladung versendet','Über Outlook, inkl. Microsoft-Teams-Link.');renderSheet();return;}
    if(a==='aufgabe'){CRM.aufgaben.push({id:'t'+CRM.aufgaben.length,titel:'Neue Aufgabe',beschreibung:'',faellig:'2026-09-05',verantwortlich:'u1',status:'offen',vorgangId:v.id});
      CRM.log(v,'aufgabe','Neue Aufgabe','Fällig 05.09.2026 · Verantwortlich Patrick Hofmann');renderSheet();return;}
    if(a==='upload'){v.dokumente.push({name:'Upload.pdf',groesse:'96 KB',datum:'2026-08-27'});
      CRM.log(v,'dokument','Upload.pdf abgelegt','Allgemeines Dokument am Vorgang.');renderSheet();return;}});

/* ---------- Angebots-Workflow ---------- */
function startWizard(v){
  wizard={schritt:1,vorgangId:v.id,positionen:[{produktId:'p1',preis:490,rabatt:0,abrechnung:'monatlich'}],
    bedingungen:'',waehrung:'EUR',startdatum:'2026-09-15',laufzeit:12,vertrag:null};
  renderWizard();
}
function renderWizard(){
  const w=wizard,v=CRM.vorgang(w.vorgangId),f=CRM.firma(v),p=CRM.personenVon(v)[0];
  const T=['Kunde','Produkte','Bedingungen','Angebot','Signatur'];
  const summe=w.positionen.reduce((s,x)=>s+CRM.positionsSumme(x),0);
  let bd='';
  if(w.schritt===1)bd=`<p class="muted">Die Kundendaten kommen aus dem Vorgang.</p>
    <div class="row"><div class="f"><label>Firma</label><input value="${esc(f.name)}" readonly></div>
    <div class="f"><label>Ansprechpartner</label><input value="${esc(CRM.name(p))}" readonly></div></div>
    <div class="f"><label>Adresse</label><input value="${esc(f.adresse+', '+f.plz+' '+f.ort+', '+f.land)}" readonly></div>
    <div class="f"><label>Empfänger</label><input value="${esc(p.emails[0])}" readonly></div>`;
  if(w.schritt===2)bd=`
    <div class="pos"><label>Produkt</label><label>Preis</label><label>Rabatt</label><label>Abrechnung</label><span></span></div>
    ${w.positionen.map((x,i)=>`<div class="pos">
      <select data-pi="${i}" data-fld="produktId">${CRM.produkte.map(pr=>`<option value="${pr.id}" ${pr.id===x.produktId?'selected':''}>${esc(pr.name)}</option>`).join('')}</select>
      <input type="number" data-pi="${i}" data-fld="preis" value="${x.preis}">
      <input type="number" data-pi="${i}" data-fld="rabatt" value="${x.rabatt}">
      <select data-pi="${i}" data-fld="abrechnung">${CRM.abrechnung.map(a=>`<option value="${a.id}" ${a.id===x.abrechnung?'selected':''}>${a.label}</option>`).join('')}</select>
      <button class="x" data-del="${i}">×</button></div>`).join('')}
    <button class="btn sm" id="addpos">+ Position</button>
    <div class="row" style="margin-top:18px"><div class="f"><label>Währung</label>
      <select data-w="waehrung">${CRM.waehrungen.map(c=>`<option ${c===w.waehrung?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="f"><label>Startdatum</label><input type="date" data-w="startdatum" value="${w.startdatum}"></div>
      <div class="f"><label>Mindestlaufzeit (Monate)</label><input type="number" data-w="laufzeit" value="${w.laufzeit}"></div></div>
    <p class="hint">Vertragsart wird abgeleitet: <b>${CRM.vertragsArt({positionen:w.positionen})}</b> · Summe ${CRM.geld(summe,w.waehrung)}</p>`;
  if(w.schritt===3)bd=`<div class="f"><label>Besondere Bedingungen (Freitext)</label>
    <textarea rows="6" data-w="bedingungen" placeholder="z. B. Rabatt gilt für die ersten 12 Monate …">${esc(w.bedingungen)}</textarea></div>
    <div class="paper">▤ <b>Lizenzvertrag_v4.pdf</b> <span class="muted">– wird dem Angebot automatisch angehängt</span></div>`;
  if(w.schritt===4)bd=`<div class="paper">
    <div class="serif" style="font-size:20px">Angebot AG-2026-042</div>
    <div class="muted">${esc(f.name)} · ${esc(CRM.name(p))}</div>
    <table style="width:100%;border-collapse:collapse;margin:16px 0"><tbody>
    ${w.positionen.map(x=>`<tr><td style="padding:6px 0;border-bottom:1px solid var(--line)">${esc(CRM.produkt(x.produktId).name)}
      <span class="muted">· ${esc(x.abrechnung)}</span></td>
      <td style="padding:6px 0;border-bottom:1px solid var(--line);text-align:right">${CRM.geld(CRM.positionsSumme(x),w.waehrung)}</td></tr>`).join('')}
    <tr><td style="padding:8px 0"><b>Summe</b></td><td style="padding:8px 0;text-align:right"><b>${CRM.geld(summe,w.waehrung)}</b></td></tr></tbody></table>
    ${w.bedingungen?`<p>${esc(w.bedingungen)}</p>`:''}
    <p class="muted">Start ${CRM.datum(w.startdatum)}${w.laufzeit?` · ${w.laufzeit} Monate Mindestlaufzeit`:''} · inkl. Lizenzvertrag als Anhang.</p></div>
    <p style="margin-top:16px">Versand über Outlook an <b>${esc(p.emails[0])}</b> mit Link zur Signaturseite. Es entsteht ein Vertrag im Status <b>„offen“</b>.</p>`;
  if(w.schritt===5)bd=`<div class="paper" style="text-align:center">
    <div style="font-size:34px">✍</div><div class="serif" style="font-size:19px">Signaturseite (Kundensicht)</div>
    <p class="muted">Einfache elektronische Signatur (EES) – es signiert ausschließlich der Kunde.</p>
    <button class="btn pri" id="dosign">Unterzeichnen</button></div>
    <p class="hint" style="margin-top:16px">Danach: signiertes PDF am Vertrag, Status „aktiv laufend“, automatische Mail an support@.</p>`;

  $('#ov').innerHTML=`<div class="mid"><div class="wz">
    <div class="h"><div><h2>Angebot erstellen</h2><div class="muted">${esc(f.name)}</div></div>
      <button class="x" id="wclose" style="margin-left:auto">×</button></div>
    <div class="steps">${T.map((t,i)=>`<div class="${i+1===w.schritt?'on':i+1<w.schritt?'done':''}">${i+1}. ${t}</div>`).join('')}</div>
    <div class="bd">${bd}</div>
    <div class="ft">${w.schritt>1?'<button class="btn" id="wback">Zurück</button>':''}<span style="flex:1"></span>
      <button class="btn" id="wcancel">Abbrechen</button>
      ${w.schritt<4?'<button class="btn pri" id="wnext">Weiter</button>':''}
      ${w.schritt===4?'<button class="btn pri" id="wsend">Angebot versenden</button>':''}</div>
  </div></div>`;
  bindWizard();
}
function bindWizard(){
  const w=wizard,v=CRM.vorgang(w.vorgangId);
  const back=()=>{wizard=null;renderSheet();};
  $('#wclose').onclick=back;$('#wcancel').onclick=back;
  if($('#wback'))$('#wback').onclick=()=>{w.schritt--;renderWizard();};
  if($('#wnext'))$('#wnext').onclick=()=>{w.schritt++;renderWizard();};
  if($('#addpos'))$('#addpos').onclick=()=>{w.positionen.push({produktId:'p3',preis:2400,rabatt:0,abrechnung:'einmalig'});renderWizard();};
  $('#ov').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(w.positionen.length>1){w.positionen.splice(+b.dataset.del,1);renderWizard();}});
  $('#ov').querySelectorAll('[data-pi]').forEach(inp=>inp.onchange=()=>{
    const p=w.positionen[+inp.dataset.pi],fld=inp.dataset.fld;
    p[fld]=fld==='preis'||fld==='rabatt'?+inp.value:inp.value;
    if(fld==='produktId'){const pr=CRM.produkt(inp.value);p.preis=pr.standardpreis;p.abrechnung=pr.standardAbrechnung||p.abrechnung;}
    renderWizard();});
  $('#ov').querySelectorAll('[data-w]').forEach(inp=>inp.onchange=()=>{
    const k=inp.dataset.w;w[k]=k==='laufzeit'?(+inp.value||null):inp.value;if(k!=='bedingungen')renderWizard();});
  if($('#wsend'))$('#wsend').onclick=()=>{
    w.vertrag=CRM.angebotAnlegen(v,w.positionen.map(p=>({...p})),w.waehrung,w.startdatum,w.laufzeit);
    w.schritt=5;renderWizard();toast('Angebot versendet · Vertrag „offen“ angelegt');};
  if($('#dosign'))$('#dosign').onclick=()=>{
    CRM.angebotSignieren(v,w.vertrag);
    if(v.phase==='deal')CRM.setzeStufe(v,'gewonnen');
    wizard=null;view.phase=v.phase;renderSheet();render(true);
    toast('Signiert · Vertrag aktiv · Mail an support@ · Vorgang jetzt Phase „Kunde“');};
}

function openThread(t){
  const v=t.vorgangId&&CRM.vorgang(t.vorgangId);
  $('#ov').innerHTML=`<div class="scrim"><div class="sheet">
    <div class="sh"><div style="display:flex;gap:12px"><div><h2>${esc(t.betreff)}</h2>
      <div class="muted">${esc(t.quelle)} · ${t.nachrichten.length} Nachricht(en)</div></div>
      <button class="x" id="tc" style="margin-left:auto">×</button></div></div>
    <div class="bd">
      <div class="panel"><div class="in"><div class="f" style="margin:0"><label>Thread-Status</label>
        <select id="ts">${Object.entries(CRM.threadStatus).map(([k,l])=>`<option value="${k}" ${t.status===k?'selected':''}>${l}</option>`).join('')}</select></div>
        <p class="hint" style="margin-bottom:0">${v?`Absender ist zugeordnet – die Nachricht liegt zusätzlich am Vorgang „${esc(CRM.firma(v).name)}“.`
          :'Absender keinem Kontakt zugeordnet. Aus einer Anfrage wird nur manuell ein Vorgang angelegt.'}</p>
        ${v?`<button class="btn sm" id="tov" style="margin-top:10px">Zum Vorgang</button>`:'<button class="btn sm" id="mk" style="margin-top:10px">Vorgang anlegen</button>'}</div></div>
      <div class="panel"><h3>Verlauf</h3><div class="in"><ul class="tl">${t.nachrichten.map(n=>`<li>
        <div class="bul mail">✉</div><div style="flex:1"><div style="display:flex"><b>${esc(n.von)}</b><span class="ts">${esc(n.ts)}</span></div>
        <p>${esc(n.text)}</p></div></li>`).join('')}</ul></div>
        <div class="write"><input placeholder="Antwort über support@ …"><button class="btn pri">Senden</button></div></div>
    </div></div></div>`;
  $('#tc').onclick=()=>{closeOv();render();};
  $('.scrim').onclick=e=>{if(e.target.classList.contains('scrim')){closeOv();render();}};
  $('#ts').onchange=e=>{t.status=e.target.value;toast('Status: '+CRM.threadStatus[t.status]);render(true);};
  if($('#tov'))$('#tov').onclick=()=>openSheet(t.vorgangId);
  if($('#mk'))$('#mk').onclick=()=>{closeOv();toast('Anlage erfolgt bewusst nur manuell');};
}

/* ---------- Shell ---------- */
function closeOv(){$('#ov').innerHTML='';view.sheet=null;}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3400);}
function render(keepSheet){
  renderTabs();
  const p=view.page;
  $('#main').innerHTML = CRM.pipelines[cur()]?pageBoard()
    :({aufgaben:pageAufgaben,support:pageSupport,kontakte:pageKontakte,produkte:pageProdukte})[p]();
  bindMain();
  if(!keepSheet&&!view.sheet)$('#ov').innerHTML='';
}
function bindMain(){
  const m=$('#main');
  m.querySelectorAll('[data-v]').forEach(el=>el.onclick=e=>{
    if(e.target.matches('input'))return; openSheet(el.dataset.v);});
  m.querySelectorAll('[data-thread]').forEach(el=>el.onclick=()=>openThread(CRM.threads.find(t=>t.id===el.dataset.thread)));
  m.querySelectorAll('[data-task]').forEach(cb=>cb.onchange=()=>{
    const a=CRM.aufgaben.find(x=>x.id===cb.dataset.task);a.status=cb.checked?'erledigt':'offen';render();});
  if($('#neu'))$('#neu').onclick=()=>toast('Demo: Dialog zum Anlegen eines Vorgangs');
  const fu=$('#fu');if(fu)fu.onchange=()=>m.querySelectorAll('.rowline[data-u]').forEach(r=>
    r.style.display=!fu.value||r.dataset.u===fu.value?'':'none');
  m.querySelectorAll('.tile[draggable]').forEach(t=>t.ondragstart=e=>e.dataTransfer.setData('id',t.dataset.v));
  m.querySelectorAll('.drop[data-stufe]').forEach(d=>{
    d.ondragover=e=>{e.preventDefault();d.classList.add('over');};
    d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=e=>{e.preventDefault();d.classList.remove('over');
      const v=CRM.vorgang(e.dataTransfer.getData('id'));const r=CRM.setzeStufe(v,d.dataset.stufe);
      if(r.konvertiert){view.phase=r.phase;toast('Endmarker → jetzt Phase „'+CRM.pipelines[r.phase].label+'“');}
      render();};});
}
$('#q').oninput=e=>{
  const r=CRM.suche(e.target.value);
  $('#res').innerHTML=r.length?`<div class="results">${r.map(x=>
    `<div data-t="${x.typ}" data-id="${x.id}"><span class="t">${x.typ}</span><span>${esc(x.label)}</span><span class="s">${esc(x.sub)}</span></div>`).join('')}</div>`:'';
  $('#res').querySelectorAll('[data-id]').forEach(d=>d.onclick=()=>{
    let id=d.dataset.id;
    if(d.dataset.t==='Person')id=(CRM.vorgaenge.find(v=>v.personIds.includes(d.dataset.id))||{}).id;
    if(d.dataset.t==='Firma')id=(CRM.vorgaenge.find(v=>v.firmaId===d.dataset.id)||{}).id;
    if(!id)return toast('Kein Vorgang zu diesem Treffer');
    $('#q').value='';$('#res').innerHTML='';openSheet(id);});
};
