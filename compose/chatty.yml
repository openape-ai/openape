  tasks:
    image: registry.openape.ai/openape-tasks:${TASKS_TAG:-unset}
    restart: unless-stopped
    user: "999:988"
    env_file: /home/openape/projects/openape-tasks/shared/.env
    environment:
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
    volumes:
      - /home/openape/projects/openape-tasks/shared:/home/openape/projects/openape-tasks/shared
    ports:
      - "127.0.0.1:3005:3005"
      - "10.0.1.1:3005:3005"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
