      start_period: 10s

  plans:
    image: registry.openape.ai/openape-plans:${PLANS_TAG:-unset}
    restart: unless-stopped
    user: "999:988"
    env_file: /home/openape/projects/openape-plans/shared/.env
    environment:
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
    volumes:
      - /home/openape/projects/openape-plans/shared:/home/openape/projects/openape-plans/shared
    ports:
      - "127.0.0.1:3004:3004"
      - "10.0.1.1:3004:3004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  timetrack:
    image: registry.openape.ai/openape-timetrack:${TIMETRACK_TAG:-unset}
    restart: unless-stopped
    user: "999:988"
    env_file: /home/openape/projects/openape-timetrack/shared/.env
    environment:
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
    volumes:
      - /home/openape/projects/openape-timetrack/shared:/home/openape/projects/openape-timetrack/shared
    ports:
      - "127.0.0.1:3011:3011"
      - "10.0.1.1:3011:3011"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  monitor:
    image: registry.openape.ai/openape-monitor:${MONITOR_TAG:-unset}
    restart: unless-stopped
    user: "999:988"
    env_file: /home/openape/projects/openape-monitor/shared/.env
    environment:
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      # shared/.env carries no port — the app's dev default (3018) is pinned
      # here so the container matches the nginx upstream.
      PORT: "3018"
      NITRO_PORT: "3018"
    volumes:
      - /home/openape/projects/openape-monitor/shared:/home/openape/projects/openape-monitor/shared
    ports:
      - "127.0.0.1:3018:3018"
      - "10.0.1.1:3018:3018"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3018/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
