    restart: unless-stopped
    user: "999:988"
    env_file: /home/openape/projects/openape-crm/shared/.env
    environment:
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      # shared/.env trägt keinen Port — der Dev-Default der App (3024) steht
      # hier, damit Container und Traefik-Upstream übereinstimmen.
      PORT: "3024"
      NITRO_PORT: "3024"
    volumes:
      - /home/openape/projects/openape-crm/shared:/home/openape/projects/openape-crm/shared
    ports:
      - "127.0.0.1:3024:3024"
      - "10.0.1.1:3024:3024"
    # Traefik wie beim dashboard — TLS kommt vom letsencrypt-Certresolver,
    # kein nginx-vhost und kein certbot auf dem Host.
    networks:
      - default
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.crm-http.entryPoints: http
      traefik.http.routers.crm-http.rule: Host(`crm.openape.ai`)
      traefik.http.routers.crm-http.middlewares: redirect-to-https
      traefik.http.routers.crm-https.entryPoints: https
      traefik.http.routers.crm-https.rule: Host(`crm.openape.ai`)
      traefik.http.routers.crm-https.tls: "true"
      traefik.http.routers.crm-https.tls.certresolver: letsencrypt
      traefik.http.routers.crm-https.middlewares: gzip
      traefik.http.services.crm.loadbalancer.server.port: "3024"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3024/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
