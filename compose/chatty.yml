  pr:
    image: registry.openape.ai/openape-pr:${PR_TAG:-unset}
    restart: unless-stopped
    user: "999:988"
    env_file: /home/openape/projects/openape-pr/shared/.env
    environment:
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
    volumes:
      - /home/openape/projects/openape-pr/shared:/home/openape/projects/openape-pr/shared
    ports:
      - "127.0.0.1:3014:3014"
      - "10.0.1.1:3014:3014"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3014/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
