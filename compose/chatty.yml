      timeout: 5s
      retries: 6
      start_period: 10s

  secrets:
    image: registry.openape.ai/openape-secrets:${SECRETS_TAG:-unset}
    restart: unless-stopped
    user: "999:988"
    env_file: /home/openape/projects/openape-secrets/shared/.env
    environment:
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      # shared/.env carries no port — the deployed port (3025) is pinned
      # here so the container matches the nginx upstream.
      PORT: "3025"
      NITRO_PORT: "3025"
    volumes:
      - /home/openape/projects/openape-secrets/shared:/home/openape/projects/openape-secrets/shared
    ports:
      - "127.0.0.1:3025:3025"
      - "10.0.1.1:3025:3025"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3025/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  question-service:
    image: registry.openape.ai/openape-question-service:${QUESTION_SERVICE_TAG:-unset}
    restart: unless-stopped
    user: "999:988"
    env_file: /home/openape/projects/openape-question-service/shared/.env
    environment:
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
    volumes:
      - /home/openape/projects/openape-question-service/shared:/home/openape/projects/openape-question-service/shared
    ports:
      - "127.0.0.1:3017:3017"
      - "10.0.1.1:3017:3017"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3017/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
