      timeout: 5s
      retries: 6
      start_period: 10s

  dashboard:
    image: registry.openape.ai/openape-dashboard:${DASHBOARD_TAG:-unset}
    restart: unless-stopped
    user: "999:988"
    env_file: /home/openape/projects/openape-dashboard/shared/.env
    environment:
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      # Der 06:30-Morning-Mail-Cron rechnet in Container-Lokalzeit.
      TZ: Europe/Vienna
    volumes:
      - /home/openape/projects/openape-dashboard/shared:/home/openape/projects/openape-dashboard/shared
    ports:
      - "127.0.0.1:3022:3022"
      - "10.0.1.1:3022:3022"
    # Traefik statt nginx: Routing über den Docker-Provider des coolify-proxy
    # (gleiches Muster wie die PR-Previews). Kein root-Dynamic-File nötig.
    networks:
      - default
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.dashboard-http.entryPoints: http
      traefik.http.routers.dashboard-http.rule: Host(`dashboard.openape.ai`)
      traefik.http.routers.dashboard-http.middlewares: redirect-to-https
      traefik.http.routers.dashboard-https.entryPoints: https
      traefik.http.routers.dashboard-https.rule: Host(`dashboard.openape.ai`)
      traefik.http.routers.dashboard-https.tls: "true"
      traefik.http.routers.dashboard-https.tls.certresolver: letsencrypt
      traefik.http.routers.dashboard-https.middlewares: gzip
      traefik.http.services.dashboard.loadbalancer.server.port: "3022"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3022/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s


  crm:
