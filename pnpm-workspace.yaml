packages:
  - packages/*
  - modules/*
  - apps/*
  - examples/*

# Supply-chain quarantine: neu publizierte npm-Versionen erst nach 7 Tagen
# installierbar (kompromittierte Frisch-Releases werden meist binnen Tagen
# gezogen). Eigene Packages ausgenommen — Publish→Konsum bleibt sofort möglich.
minimumReleaseAge: 10080
# Jeder Eintrag hebelt die Quarantäne für ein Paket aus und gehört wieder raus,
# sobald die aufgelöste Version 7 Tage alt ist. Das Freigabe-Datum NICHT
# schätzen, sondern ausrechnen — geschätzte Daten haben socket.io-parser drei
# Wochen länger als nötig stehen lassen:
#
#   1. Aufgelöste Version aus pnpm-lock.yaml holen, NICHT aus dem Kommentar
#      hier (der driftet: bei ip-address stand 10.3.1, aufgelöst war 10.4.0):
#        grep -oE '^  <pkg>@[0-9][^:]*' pnpm-lock.yaml | sort -u
#   2. Publish-Zeitpunkt genau dieser Version abfragen:
#        npm view <pkg> time --json
#
# Freigabe = Publish + 7 Tage, unten als UTC notiert.
minimumReleaseAgeExclude:
  - '@openape/*'
  # brace-expansion 1.1.18/2.1.4/5.0.9 (Security-Override gegen
  # GHSA-rgw5-rvv9-x895).
  # Publish 2026-07-30 10:17 UTC → frei ab 2026-08-06 10:17 UTC.
  - brace-expansion
  # fast-uri 4.1.2 (Security-Override gegen das Advisory vom 2026-08-04).
  # Publish 2026-07-31 09:09 UTC → frei ab 2026-08-07 09:09 UTC.
  - fast-uri
  # ip-address 10.4.0 (Security-Override >=10.3.1, aufgelöst wird 10.4.0).
  # Publish 2026-07-31 05:07 UTC → frei ab 2026-08-07 05:07 UTC.
  - ip-address
  # hono 4.12.34 (Security-Override gegen GHSA-8j4g-w8fx-2239, ReDoS in der
  # CORS-Middleware). Der Fix existiert erst ab 4.12.34, die Version ist damit
  # selbst noch jung. Der Override pinnt deshalb exakt 4.12.34 statt
  # '>=4.12.34' — ohne Quarantäne käme sonst das 1,6 Tage alte 4.13.0 herein,
  # also genau das, wovor die Quarantäne schützt. Fällt die Ausnahme weg, darf
  # der Pin wieder zur Range werden.
  # Publish 2026-08-03 02:36 UTC → frei ab 2026-08-10 02:36 UTC.
  - hono

