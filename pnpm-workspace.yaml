packages:
  - packages/*
  - modules/*
  - apps/*
  - examples/*

# CVE owner-approved 2026-10-02; rationale and reassessment triggers:
# docs/operations/dependency-audit-exceptions.md
# Only the listed advisories are excluded; other audit thresholds remain unchanged.
auditConfig:
  ignoreCves:
    - CVE-2026-85393
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    # simple-git 3.x via nuxt > @nuxt/devtools (development tooling only).
    # Owner decision 2026-10-06, issue 1428: simple-git 4 drops the default export
    # that every @nuxt/devtools 3.x release imports, so no update resolves these.
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    - GHSA-v5rq-49vh-5v5c
    # zod 3.25.76 via apps/docs > @nuxt/content (build-time collection schemas
    # over first-party docs sources). The fix exists only as zod >=4.6.6; every
    # @nuxt/content 3.x release requires zod ^3.25.76, so no update resolves it.
    # Owner decision 2026-10-24; rationale in the exceptions document above.
    - GHSA-mrhx-c7xc-m3w5

# Quarantine new npm releases for seven days. First-party packages are exempt.
minimumReleaseAge: 10080
# Remove exceptions after the exact resolved lockfile version passes quarantine.
# Verify its npm publication timestamp; eligibility is publication + seven days.
minimumReleaseAgeExclude:
  - '@openape/*'
  # First-party unscoped package; permanent exemption like @openape/*.
  - test2docs
  # electron 42.11.16: clears the high advisories up to GHSA-jr5w-w6x2-84p9.
  # Exact pin in apps/openape-pods prevents newer, unquarantined releases.
  # Published 2026-10-20 02:53 UTC; eligible 2026-10-27 02:53 UTC.
  - electron
  # happy-dom 21.0.4: GHSA-834v-8h66-3h79. Exact catalog pin, see catalog.
  # Published 2026-10-20 18:05 UTC; eligible 2026-10-27 18:05 UTC.
  - happy-dom
  # body-parser 2.4.0: GHSA-27r3-jxmh-p828. Exact override pin, see overrides.
  # Published 2026-10-22 11:39 UTC; eligible 2026-10-29 11:39 UTC.
  - body-parser

catalog:
  '@antfu/eslint-config': ^7.7.3
  '@changesets/cli': ^2.31.0
  '@iconify-json/lucide': ^1.2.114
  '@nuxt/kit': ^4.4.8
  '@nuxt/module-builder': ^1.0.2
  '@nuxt/ui': ^4.9.0
  '@types/node': ^22.20.0
  '@types/shell-quote': ^1.7.5
  '@types/web-push': ^3.6.4
  '@types/ws': ^8.18.1
  '@vite-pwa/nuxt': ^1.1.1
  '@vitejs/plugin-vue': ^6.0.7
  '@vitest/browser': ^4.1.12
  '@vitest/browser-playwright': ^4.1.12
  '@vitest/coverage-istanbul': ^4.1.12
  '@vue/test-utils': ^2.4.11
  'aws4fetch': ^1.0.20
  'consola': ^3.4.2
  'defu': ^6.1.7
  'drizzle-orm': ^0.45.2
  'eslint': ^9.39.4
  'h3': ^1.15.11
  # GHSA-834v-8h66-3h79. Exact pin: 21.0.4 is still inside the seven-day quarantine.
  'happy-dom': 21.0.4
  'jose': ^5.10.0
  'marked': ^18.0.5
  # Nitro advisories fixed in 4.6.2; published 2026-10-16, quarantine passed.
  'nuxt': ^4.6.2
  'ofetch': ^1.5.1
  # Keep Playwright identical: CLI and tests share a registry. Duplicate versions
  # can report "No tests found" instead of a version warning.
  '@playwright/test': 1.62.1
  'playwright': 1.62.1
  'shell-quote': ^1.9.0
  'tailwindcss': ^4.3.1
  'tsup': ^8.5.1
  'typescript': ^5.9.3
  'ulid': ^2.4.0
  'vitest': ^4.1.12
  'vue': ^3.5.41
  'vue-tsc': ^3.3.5
  'web-push': ^3.6.7
  'ws': ^8.21.0
  'yaml': ^2.9.0
  # GHSA-mrhx-c7xc-m3w5; 4.6.6 published 2026-10-11, quarantine already passed.
  'zod': ^4.6.6

onlyBuiltDependencies:
  - electron
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - sharp
  - unrs-resolver
  - vue-demi

overrides:
  # GHSA-p2f4-r6v6-j797: the pinned updater still requests the vulnerable 9.3.1.
  'electron-updater@6.6.2>builder-util-runtime': 9.7.0
  '@nuxtjs/mdc': 0.22.1
  # Security fixes verified 2026-09-07; both versions exceed the 7-day quarantine.
  browserslist: ">=4.28.7 <5"
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4'
  '@hono/node-server': '>=2.0.5'
  'tar@>=7 <7.5.21': '>=7.5.21'
  # ReDoS follow-ups; all three published 2026-09-14, quarantine passed.
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'brace-expansion@5': 5.0.12
  # GHSA-xjj6-f33q-929c and GHSA-4qv8-2p9j-2685; both fixes published
  # 2026-10-15, seven-day quarantine already passed.
  'undici@6': '>=6.29.1'
  'undici@8': '>=8.12.2'
  defu: '>=6.1.5'
  # GHSA-j22f-vq7h-c4qm, GHSA-mcm9-63f2-9j32 and GHSA-x5rw-q4pp-hg5g.
  # 5.9.3 published 2026-09-18 18:45 UTC; seven-day quarantine already passed.
  devalue: 5.9.3
  drizzle-orm: '>=0.45.2'
  # GHSA-qw65-cvwx-89v3 / GHSA-58mr-gqgx-xq4g; 4.1.5 published 2026-09-15.
  # 4.2.3 fixes the remaining advisories but is quarantined until 2026-10-26.
  fast-uri: 4.1.5
  # Advisory follow-ups; both published >7 days before 2026-10-25.
  'fflate@<0.7.5': '>=0.7.5'
  # 10.7.4 published 2026-10-11, quarantine passed.
  ip-address: '>=10.7.4'
  flatted: '>=3.4.2'
  # Fixes through 4.13.11; published 2026-09-29, quarantine passed.
  hono: 4.13.11
  # Transitive apps/docs dependencies stay on their current majors;
  # the advisories do not require js-yaml 5 or nanoid 5.
  # GHSA-5p4m-2wfm-xmqj and GHSA-2883-xcg3-v3hh; 3.15.2 published 2026-08-26.
  'js-yaml@3': '>=3.15.2 <4'
  # The unbounded range resolves into the 5.x line; 5.4.1+ carries its fix.
  'js-yaml@4': '>=5.4.1'
  'nanoid@3': '>=3.3.18'
  # A single Vue instance is required: Nuxt 4.5.2 accepts ^3.5.40.
  # Duplicate instances broke six CRM component tests through resolveComponent.
  # GHSA-g2v6-rqmx-r4w6 (@vue/server-renderer <3.5.42); 3.5.43 published 2026-09-17.
  vue: '>=3.5.43'
  lodash: ^4.17.21
  # GHSA-22jm-h49p-29qw and GHSA-46jr-4wx8-v453; also covers devframe.
  # 1.32.0 published 2026-10-02; seven-day quarantine already passed.
  '@modelcontextprotocol/sdk@<1.32.0': 1.32.0
  # GHSA-27r3-jxmh-p828 via @modelcontextprotocol/sdk > express.
  # Exact pin: 2.4.0 is still inside the seven-day quarantine.
  'body-parser@2': 2.4.0
  # GHSA-587h-7wmj-h5pm; both fixes published 2026-10-06 and passed quarantine.
  'vite@>=8.2.0 <8.2.4': 8.2.4
  'launch-editor@<2.14.2': 2.14.2
  node-forge: '>=1.4.0'
  path-to-regexp: '>=8.4.0'
  # GHSA-jqcg-44mw-7w3h; 2.0.8 published 2026-09-15.
  proxy-addr: '>=2.0.8'
  # GHSA-c8x8-7fp4-3x9w; 1.42.3 published 2026-08-24.
  prosemirror-view: '>=1.42.3'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.18'
  # 7.1.3 fixes the remaining low advisory but is quarantined until 2026-10-29.
  serialize-javascript: '>=7.0.3'
  # Low-severity dev-server advisory; 0.28.1 published 2026-06-11.
  'esbuild@<0.28.1': '>=0.28.1'
  # 7.1.6 published 2026-09-03; also lifts eslint-plugin-vue's 6.x resolution.
  'postcss-selector-parser@<7.1.6': '>=7.1.6'
  # GHSA-jp82-f5mq-hwhp; 1.6.3 and later published in September 2026.
  seroval: '>=1.6.3'
  # GHSA-68fv-2mgg-jv7q; 1.2.2 published 2026-09-30, quarantine passed.
  source-map-js: '>=1.2.2'
  # Patched releases verified on 2026-09-12; all exceed the seven-day quarantine.
  # Tiptap declares exact peer versions, so its package family moves together.
  '@tiptap/core': 3.30.5
  '@tiptap/extension-blockquote': 3.30.5
  '@tiptap/extension-bold': 3.30.5
  '@tiptap/extension-bubble-menu': 3.30.5
