packages:
  - packages/*
  - modules/*
  - apps/*
  - examples/*

# Supply-chain quarantine: neu publizierte npm-Versionen erst nach 7 Tagen
# installierbar (kompromittierte Frisch-Releases werden meist binnen Tagen
# gezogen). Eigene Packages ausgenommen — Publish→Konsum bleibt sofort möglich.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@openape/*'
  # postcss 8.5.25 (Security-Override >=8.5.18) war beim Einführen der
  # Quarantäne <7 Tage alt und blockte jede non-frozen Resolution.
  # Ausnahme entfernen, sobald 8.5.25 gealtert ist (nach 2026-08-05).
  - postcss
  # brace-expansion 1.1.18/2.1.4/5.0.9 (Security-Override gegen
  # GHSA-rgw5-rvv9-x895) war beim Bump <7 Tage alt und blockte jede
  # non-frozen Resolution. Ausnahme entfernen, sobald gealtert (nach
  # 2026-08-09).
  - brace-expansion
  # fast-uri 4.1.2 / ip-address 10.3.1 / socket.io-parser 4.2.7 (Security-
  # Overrides gegen die Advisories vom 2026-08-04) waren beim Bump <7 Tage alt.
  # Ausnahmen entfernen, sobald gealtert (nach 2026-08-11).
  - fast-uri
  - ip-address
  - socket.io-parser

auditConfig:
  ignoreGhsas:
    # brace-expansion DoS: patch existiert nur in 5.0.8 (API-inkompatibel zu
    # v1/v2 — exportiert {expand} statt der Funktion); betroffene Pfade sind
    # Build-Tooling (glob/minimatch/eslint) ohne attacker-controlled Input.
    # v1/v2 sind via Overrides auf dem Stand des Schwester-Advisories
    # GHSA-3jxr-9vmj-r5cp (1.1.17/2.1.3).
    - GHSA-mh99-v99m-4gvg
    - GHSA-r5fr-rjxr-66jc
    - GHSA-gv7w-rqvm-qjhr
    - GHSA-fx2h-pf6j-xcff

