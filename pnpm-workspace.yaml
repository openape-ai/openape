packages:
  - packages/*
  - modules/*
  - apps/*
  - examples/*

# Quarantine new npm releases for seven days. First-party packages are exempt.
minimumReleaseAge: 10080
# Remove exceptions after the exact resolved lockfile version passes quarantine.
# Verify its npm publication timestamp; eligibility is publication + seven days.
minimumReleaseAgeExclude:
  - '@openape/*'
  # First-party unscoped package; permanent exemption like @openape/*.
  - test2docs
  # brace-expansion 1.1.18/2.1.4/5.0.9: GHSA-rgw5-rvv9-x895.
  # Published 2026-07-30 10:17 UTC; eligible 2026-08-06 10:17 UTC.
  - brace-expansion
  # fast-uri 4.1.2: security advisory from 2026-08-04.
  # Published 2026-07-31 09:09 UTC; eligible 2026-08-07 09:09 UTC.
  - fast-uri
  # ip-address 10.4.0 resolved under the >=10.3.1 override.
  # Published 2026-07-31 05:07 UTC; eligible 2026-08-07 05:07 UTC.
  - ip-address
  # hono 4.12.34: GHSA-8j4g-w8fx-2239, CORS middleware ReDoS.
  # Exact pin prevents this exception admitting newer, unquarantined releases.
  # Published 2026-08-03 02:36 UTC; eligible 2026-08-10 02:36 UTC.
  - hono

catalog:
  '@antfu/eslint-config': ^7.7.3
  '@changesets/cli': ^2.31.0
  '@iconify-json/lucide': ^1.2.114
  '@nuxt/kit': ^4.4.8
  '@nuxt/module-builder': ^1.0.2
  '@nuxt/ui': ^4.9.0
  '@types/node': ^22.20.0
  '@types/shell-quote': ^1.7.5
  '@types/web-push': ^3.6.4
  '@types/ws': ^8.18.1
  '@vite-pwa/nuxt': ^1.1.1
  '@vitejs/plugin-vue': ^6.0.7
  '@vitest/browser': ^4.1.10
  '@vitest/browser-playwright': ^4.1.10
  '@vitest/coverage-istanbul': ^4.1.10
  '@vue/test-utils': ^2.4.11
  'aws4fetch': ^1.0.20
  'consola': ^3.4.2
  'defu': ^6.1.7
  'drizzle-orm': ^0.45.2
  'eslint': ^9.39.4
  'h3': ^1.15.11
  'happy-dom': ^20.0.0
  'jose': ^5.10.0
  'marked': ^18.0.5
  'nuxt': ^4.5.2
  'ofetch': ^1.5.1
  # Keep Playwright identical: CLI and tests share a registry. Duplicate versions
  # can report "No tests found" instead of a version warning.
  '@playwright/test': 1.62.1
  'playwright': 1.62.1
  'shell-quote': ^1.9.0
  'tailwindcss': ^4.3.1
  'tsup': ^8.5.1
  'typescript': ^5.9.3
  'ulid': ^2.4.0
  'vitest': ^4.1.10
  'vue': ^3.5.41
  'vue-tsc': ^3.3.5
  'web-push': ^3.6.7
  'ws': ^8.21.0
  'yaml': ^2.9.0
  'zod': ^4.4.3

onlyBuiltDependencies:
  - electron
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - sharp
  - unrs-resolver
  - vue-demi

overrides:
  # Security fixes verified 2026-09-07; both versions exceed the 7-day quarantine.
  browserslist: ">=4.28.7 <5"
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4'
  '@hono/node-server': '>=2.0.5'
  'tar@>=7 <7.5.21': '>=7.5.21'
  'brace-expansion@1': '>=1.1.18 <2'
  'brace-expansion@2': '>=2.1.4 <3'
  'brace-expansion@5': '>=5.0.9'
  defu: '>=6.1.5'
  devalue: '>=5.8.1'
  drizzle-orm: '>=0.45.2'
  fast-uri: '>=4.1.3 <5'
  ip-address: '>=10.3.1'
  flatted: '>=3.4.2'
  hono: 4.12.34
  # Transitive apps/docs dependencies stay on their current majors;
  # the advisories do not require js-yaml 5 or nanoid 5.
  'js-yaml@4': '>=4.3.1'
  'nanoid@3': '>=3.3.18'
  # A single Vue instance is required: Nuxt 4.5.2 needs 3.5.41.
  # Duplicate instances broke six CRM component tests through resolveComponent.
  vue: '>=3.5.41'
  lodash: ^4.17.21
  node-forge: '>=1.4.0'
  path-to-regexp: '>=8.4.0'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.18'
  serialize-javascript: '>=7.0.3'
  # Patched releases verified on 2026-09-12; all exceed the seven-day quarantine.
  # Tiptap declares exact peer versions, so its package family moves together.
  '@tiptap/core': 3.30.5
  '@tiptap/extension-blockquote': 3.30.5
  '@tiptap/extension-bold': 3.30.5
  '@tiptap/extension-bubble-menu': 3.30.5
  '@tiptap/extension-bullet-list': 3.30.5
  '@tiptap/extension-code': 3.30.5
  '@tiptap/extension-code-block': 3.30.5
  '@tiptap/extension-collaboration': 3.30.5
  '@tiptap/extension-document': 3.30.5
  '@tiptap/extension-drag-handle': 3.30.5
  '@tiptap/extension-drag-handle-vue-3': 3.30.5
  '@tiptap/extension-dropcursor': 3.30.5
  '@tiptap/extension-floating-menu': 3.30.5
  '@tiptap/extension-gapcursor': 3.30.5
  '@tiptap/extension-hard-break': 3.30.5
  '@tiptap/extension-heading': 3.30.5
  '@tiptap/extension-horizontal-rule': 3.30.5
  '@tiptap/extension-image': 3.30.5
  '@tiptap/extension-italic': 3.30.5
  '@tiptap/extension-link': 3.30.5
  '@tiptap/extension-list': 3.30.5
  '@tiptap/extension-list-item': 3.30.5
  '@tiptap/extension-list-keymap': 3.30.5
  '@tiptap/extension-mention': 3.30.5
  '@tiptap/extension-node-range': 3.30.5
  '@tiptap/extension-ordered-list': 3.30.5
  '@tiptap/extension-paragraph': 3.30.5
  '@tiptap/extension-placeholder': 3.30.5
  '@tiptap/extension-strike': 3.30.5
  '@tiptap/extension-text': 3.30.5
  '@tiptap/extension-underline': 3.30.5
  '@tiptap/extensions': 3.30.5
  '@tiptap/markdown': 3.30.5
  '@tiptap/pm': 3.30.5
  '@tiptap/starter-kit': 3.30.5
  '@tiptap/suggestion': 3.30.5
  '@tiptap/vue-3': 3.30.5
  '@tiptap/y-tiptap': 3.0.7
  sharp: 0.35.4
  smol-toml: 1.7.1
  shell-quote: '>=1.8.4'
  simple-git: '>=3.36.0'
  socket.io-parser: '>=4.2.7'
  svgo: 4.1.0
  ws: '>=8.21.0'

# Nuxt Content 3.14 imports H3 at runtime but omits it from its manifest.
# Its Nitro 2 integration requires H3 1, regardless of the public hoist order.
packageExtensions:
  '@nuxt/content@3.14.0':
    dependencies:
      h3: 1.15.11
