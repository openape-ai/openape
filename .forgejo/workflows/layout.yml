# Shared with the local pre-push gate: scripts/check.mjs + .openape/checks.json.
# Every mirrored branch is checked at its exact pushed commit. No main-vs-main diff.
name: layout
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: mac
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Shared layout contract
        run: pnpm check:ci --suite layout
      - name: Preserve complete check logs and summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: layout-check-results
          path: .openape/check-results/
          if-no-files-found: warn
