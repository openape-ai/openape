# Shared with the local pre-push gate: scripts/check.mjs + .openape/checks.json.
# Every mirrored branch is checked at its exact pushed commit. No main-vs-main diff.
name: layout
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: mac
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set up the pinned Pods CLI compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Restore check cache
        uses: actions/cache@v3
        with:
          path: .turbo-cache
          key: checks-${{ runner.os }}-layout-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ github.sha }}
          restore-keys: checks-${{ runner.os }}-layout-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-
      - name: Shared layout contract
        run: pnpm check:ci --suite layout
        env:
          TURBO_CACHE_DIR: .turbo-cache
      - name: Preserve complete check logs and summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: layout-check-results
          path: .openape/check-results/
          if-no-files-found: warn
      - name: Report checked SHA and log excerpts to ape-git
        if: always() && github.event_name == 'push'
        env:
          APE_GIT_STATUS_SECRET: ${{ secrets.APE_GIT_STATUS_SECRET }}
          APE_CHECK_JOB_STATUS: ${{ job.status }}
        run: git show "$GITHUB_SHA:scripts/report-check.mjs" | node --input-type=module - layout
