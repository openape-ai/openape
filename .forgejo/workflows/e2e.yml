# Shared with the local pre-push gate: scripts/check.mjs + .openape/checks.json.
# Every mirrored branch is checked at its exact pushed commit. No main-vs-main diff.
name: e2e
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Restore check cache
        uses: actions/cache@v3
        with:
          path: .turbo-cache
          key: checks-${{ runner.os }}-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: checks-${{ runner.os }}-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Shared e2e contract
        run: pnpm check:ci --suite e2e
        env:
          TURBO_CACHE_DIR: .turbo-cache
      - name: Preserve complete check logs and summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-check-results
          path: .openape/check-results/
          if-no-files-found: warn
      - name: Build testrun manifest
        if: always()
        # --series is the per-branch stability key: re-runs on the same branch
        # (or PR head branch) update ONE proof link, version-counted, instead
        # of minting a new link per CI run.
        run: |
          REPORT_DIR=$(find .openape/check-results -mindepth 1 -maxdepth 1 -type d -name "*-e2e" | sort | tail -1)
          node --test scripts/e2e-manifest.test.mjs
          node scripts/e2e-manifest.mjs --out /tmp/e2e-run \
            --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_NUMBER" \
            --series "e2e-${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            core="$REPORT_DIR/openape-e2e.json" \
            testrun="$REPORT_DIR/-openape-testrun-app.json" \
            apepr="$REPORT_DIR/-openape-pr-app.json" \
            free-idp="$REPORT_DIR/openape-free-idp.json" \
            --allow-empty
      - name: Attach manifest as workflow artifact
        if: always()
        continue-on-error: true
        # v4 refuses to run against Forgejo (GHES detection); v3 works.
        uses: actions/upload-artifact@v3
        with:
          name: e2e-testrun-manifest
          path: /tmp/e2e-run/testrun.json
      # Upload to testrun.openape.ai only when the CI agent credentials are
      # configured (repo secrets): TESTRUN_CI_EMAIL is a key-based agent on
      # the IdP, TESTRUN_CI_KEY its Ed25519 private key (OpenSSH format).
      # `apes login --key` runs the headless challenge-response flow, then
      # `ape-testruns upload` exchanges the IdP token for an SP token via
      # /api/cli/exchange. Never fails the job (continue-on-error) — the
      # proof link is a bonus, not a gate.
      - name: Publish proof link to testrun.openape.ai
        if: always()
        continue-on-error: true
        env:
          TESTRUN_CI_EMAIL: ${{ secrets.TESTRUN_CI_EMAIL }}
          TESTRUN_CI_KEY: ${{ secrets.TESTRUN_CI_KEY }}
          TESTRUN_CI_IDP: ${{ secrets.TESTRUN_CI_IDP }}
        run: |
          if [ -z "$TESTRUN_CI_KEY" ] || [ -z "$TESTRUN_CI_EMAIL" ]; then
            echo "TESTRUN_CI_KEY / TESTRUN_CI_EMAIL secrets not configured — skipping upload; the manifest is attached as a workflow artifact."
            exit 0
          fi
          install -m 600 /dev/null /tmp/testrun-ci-key
          printf '%s\n' "$TESTRUN_CI_KEY" > /tmp/testrun-ci-key
          # Run npx from an empty dir: inside the workspace it resolves
          # @openape/apes to the LOCAL package whose bin link never exists
          # (dist/ is unbuilt at install time) -> `apes: not found` (run 3142).
          # From a clean cwd npx fetches the published CLIs instead.
          cd "$(mktemp -d)"
          npx -y @openape/apes login "$TESTRUN_CI_EMAIL" --key /tmp/testrun-ci-key ${TESTRUN_CI_IDP:+--idp "$TESTRUN_CI_IDP"}
          npx -y @openape/ape-testruns upload /tmp/e2e-run
      - name: Report checked SHA and log excerpts to ape-git
        if: always() && github.event_name == 'push'
        env:
          APE_GIT_STATUS_SECRET: ${{ secrets.APE_GIT_STATUS_SECRET }}
          APE_CHECK_JOB_STATUS: ${{ job.status }}
        run: git show "$GITHUB_SHA:scripts/report-check.mjs" | node --input-type=module - e2e
