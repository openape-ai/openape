# Shared with the local pre-push gate: scripts/check.mjs + .openape/checks.json.
# Every mirrored branch is checked at its exact pushed commit. No main-vs-main diff.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Shared unit contract
        run: pnpm check:ci --suite unit
      - name: Preserve complete check logs and summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-check-results
          path: .openape/check-results/
          if-no-files-found: warn
