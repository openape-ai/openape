# Shared with the local pre-push gate: scripts/check.mjs + .openape/checks.json.
# Branch heads run the affected subset against origin/main at their exact pushed
# commit; pushes to main run the complete contract as the post-merge safety net.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Restore check cache
        uses: actions/cache@v3
        with:
          path: .turbo-cache
          key: checks-${{ runner.os }}-unit-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ github.sha }}
          restore-keys: checks-${{ runner.os }}-unit-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-
      - name: Shared unit contract
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            pnpm check:ci --suite unit
          else
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            pnpm check:affected --base origin/main --head "$GITHUB_SHA" --suite unit
          fi
        env:
          TURBO_CACHE_DIR: .turbo-cache
      - name: Preserve complete check logs and summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-check-results
          path: .openape/check-results/
          if-no-files-found: warn
      - name: Report checked SHA and log excerpts to ape-git
        if: always() && github.event_name == 'push'
        env:
          APE_GIT_STATUS_SECRET: ${{ secrets.APE_GIT_STATUS_SECRET }}
          APE_CHECK_JOB_STATUS: ${{ job.status }}
        run: git show "$GITHUB_SHA:scripts/report-check.mjs" | node --input-type=module - unit
