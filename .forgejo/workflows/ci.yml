# Shared with the local pre-push gate: scripts/check.mjs + .openape/checks.json.
# Every mirrored branch is checked at its exact pushed commit. No main-vs-main diff.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Restore check cache
        uses: actions/cache@v3
        with:
          path: .turbo-cache
          key: checks-${{ runner.os }}-unit-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: checks-${{ runner.os }}-unit-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Shared unit contract
        run: pnpm check:ci --suite unit
        env:
          TURBO_CACHE_DIR: .turbo-cache
      - name: Preserve complete check logs and summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-check-results
          path: .openape/check-results/
          if-no-files-found: warn
      - name: Report checked SHA and log excerpts to ape-git
        if: always() && github.event_name == 'push'
        env:
          APE_GIT_STATUS_SECRET: ${{ secrets.APE_GIT_STATUS_SECRET }}
          APE_CHECK_JOB_STATUS: ${{ job.status }}
        run: git show "$GITHUB_SHA:scripts/report-check.mjs" | node --input-type=module - unit
